name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - claude/repo-overview-lkb0ba
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # Optional: set an OMDB_API_KEY repository variable to use your own key.
          # Falls back to OMDB's public demo key.
          OMDB_API_KEY: ${{ vars.OMDB_API_KEY || 'thewdb' }}
          # Derives the base path from the repository name, so a fork or a
          # rename does not need this workflow edited.
          BASE_PATH: /${{ github.event.repository.name }}
          SITE: https://${{ github.repository_owner }}.github.io
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
